name: Go Report Card

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-card:
    name: Grade (Go Report Card)
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the generated badge and report back to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: grc
        uses: soulteary/goreportcard-action@739d8af6eb6bbd62d7ab521523415d3e5c53b70e # v1.0.0
        with:
          directory: "."
          output: ".github/goreportcard.svg"
          report_output: ".github/goreportcard-report.md"
          commit: "true"

      - name: Report grade
        run: echo "Grade ${{ steps.grc.outputs.grade }} (${{ steps.grc.outputs.score }}%)"
