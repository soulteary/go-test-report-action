name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and push the moving major tag
      id-token: write # cosign keyless signing + provenance via OIDC
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          # Derive the moving major tag, e.g. v1 from v1.2.3.
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: bash scripts/build-release.sh "${{ steps.ver.outputs.version }}" dist

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          artifact-name: gtr_${{ steps.ver.outputs.version }}_sbom.cdx.json
          output-file: dist/gtr_${{ steps.ver.outputs.version }}_sbom.cdx.json

      - name: Sign archives and checksums (cosign keyless)
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cd dist
          for f in *.tar.gz *.zip checksums.txt *_sbom.cdx.json; do
            [ -e "$f" ] || continue
            echo "signing $f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Attest build provenance for archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          gh release create "$v" dist/* \
            --title "$v" \
            --generate-notes

      - name: Update moving major tag
        if: startsWith(steps.ver.outputs.version, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          major="${{ steps.ver.outputs.major }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "${{ steps.ver.outputs.version }}"
          git push -f origin "refs/tags/${major}"
