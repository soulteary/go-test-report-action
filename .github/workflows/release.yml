name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          # Derive the moving major tag, e.g. v1 from v1.2.3.
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: bash scripts/build-release.sh "${{ steps.ver.outputs.version }}" dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          gh release create "$v" dist/* \
            --title "$v" \
            --generate-notes

      - name: Update moving major tag
        if: startsWith(steps.ver.outputs.version, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          major="${{ steps.ver.outputs.major }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "${{ steps.ver.outputs.version }}"
          git push -f origin "refs/tags/${major}"
