name: Release

on:
  push:
    tags:
      # Stable three-segment releases only. "v*.*.*" also matched prerelease
      # tags such as v1.2.0-rc.1, and the alias step below derives the major
      # with "%%" -- so publishing a release candidate force-moved v1 onto it
      # and every consumer pinned to @v1 silently followed.
      - "v[0-9]+.[0-9]+.[0-9]+"
  # The push trigger alone is not enough. GitHub skips push-triggered runs when
  # the HEAD COMMIT MESSAGE contains "[skip ci]", and for a tag push the head
  # commit is the tagged commit -- so a tag cut at such a commit silently starts
  # nothing. That is not hypothetical here: the Go Report Card job commits
  # "chore: update Go Report Card badge [skip ci]" to main on every push, so
  # main's tip carries that marker much of the time. v1.1.1 was tagged at
  # 091a510, exactly such a commit, and no run started at all.
  #
  # The skip directive applies to push and pull_request only, so the release
  # event gets through. It also fires on the action the releases here are
  # actually made by -- creating the Release in the UI -- rather than on a proxy
  # for it.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: read

# A UI release fires push AND release, so without this the same tag builds twice
# and the second run clobbers the first's assets mid-upload. Not cancel-in-
# progress: a half-finished upload is worse than a duplicated one.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # The push trigger's tag filter keeps prereleases out, and the release
    # trigger has no filter of its own -- so it needs this. The alias step
    # derives the major with "%%", so building v1.2.0-rc.1 would force-move v1
    # onto a release candidate and every consumer pinned to @v1 would follow.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and push the moving major tag
      id-token: write # cosign keyless signing + provenance via OIDC
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the tool, not just the installer. This is the installer's own
          # default today, so it changes nothing now -- it stops a future
          # installer bump from moving cosign underneath us silently.
          cosign-release: v3.0.6

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME}"
          fi
          # Every path ends at the alias step, which derives the major with
          # "%%". Only the push trigger filters the tag shape, so a dispatch
          # typed as "v1.2.0-rc.1" -- or a release published at such a tag --
          # would reach it and force-move v1 onto a prerelease. Check the shape
          # once, here, where all three triggers meet.
          if ! printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::refusing to release '${v}': not a stable vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          # Derive the moving major tag, e.g. v1 from v1.2.3.
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: bash scripts/build-release.sh "${{ steps.ver.outputs.version }}" dist

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          artifact-name: gtr_${{ steps.ver.outputs.version }}_sbom.cdx.json
          output-file: dist/gtr_${{ steps.ver.outputs.version }}_sbom.cdx.json

      - name: Sign archives and checksums (cosign keyless)
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cd dist
          for f in *.tar.gz *.zip checksums.txt *_sbom.cdx.json; do
            [ -e "$f" ] || continue
            echo "signing $f"
            # cosign v3 defaults to the new bundle format, under which
            # --output-signature and --output-certificate are ignored; with no
            # --bundle given it fails with "create bundle file: open : no such
            # file or directory". The bundle carries signature and certificate.
            cosign sign-blob --yes \
              --bundle "${f}.cosign.bundle" \
              "$f"
          done

      - name: Attest build provenance for archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          # Creating a Release through the UI also creates its tag, which is what
          # starts this workflow -- so the Release usually already exists by the
          # time this runs. A bare `gh release create` then aborts with "a release
          # with the same tag name already exists", which is exactly how the only
          # run this workflow has ever had (32470223600, v1.0.0) died: after the
          # build, SBOM, signing and attestation had all succeeded, and with every
          # artifact discarded.
          if gh release view "$v" >/dev/null 2>&1; then
            # --clobber deletes and re-uploads same-named assets, so it must
            # never run on a build that does not correspond to $v. The checkout
            # step has no `ref:`, so a manual dispatch naming an existing tag
            # builds the dispatch ref instead -- previously that was merely
            # mislabeled and `gh release create` refused it, but an unguarded
            # --clobber would replace a published release's real assets with
            # binaries built from something else.
            #
            # Matching the name alone is not enough: GITHUB_REF_NAME is the
            # short name of a branch just as much as of a tag, so a dispatch
            # from a branch literally named "v1.1.1" would satisfy it while
            # building the branch. The ref must also BE a tag. Both runs that
            # do build the right tree still pass -- the tag push, and a
            # dispatch started from the tag itself, which is the documented
            # recovery path.
            if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME}" != "$v" ]; then
              echo "::error::refusing to overwrite ${v} assets from a run building ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
              exit 1
            fi
            echo "Release $v already exists; uploading artifacts into it."
            gh release upload "$v" dist/* --clobber
          else
            gh release create "$v" dist/* \
              --title "$v" \
              --generate-notes
          fi

      - name: Update moving major tag
        if: startsWith(steps.ver.outputs.version, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          major="${{ steps.ver.outputs.major }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "${{ steps.ver.outputs.version }}"
          git push -f origin "refs/tags/${major}"
